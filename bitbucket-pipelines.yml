image: node:20

definitions:
  caches:
    npm: ~/.npm
  services:
    docker:
      memory: 2048
  steps:
    - step: &validate-and-sync
        name: Fast Validation & Mirror Sync (< 1 min)
        caches:
          - npm
        script:
          - npm ci --legacy-peer-deps
          - npm run lint
          - npm run type-check
          - |
            set -e
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "ERROR: GITHUB_TOKEN is not defined in Bitbucket repository variables." >&2
              exit 1
            fi
            git remote add github https://github.com/androidnikhil/wide-vogue.git 2>/dev/null || git remote set-url github https://github.com/androidnikhil/wide-vogue.git
            AUTH_HEADER="AUTHORIZATION: basic $(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git config --local http.https://github.com/.extraheader "$AUTH_HEADER"
            trap 'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true; git remote remove github 2>/dev/null || true' EXIT
            REMOTE_REF=$(git ls-remote --heads github main)
            if [ -z "$REMOTE_REF" ]; then
              echo "GitHub main branch does not exist yet (empty repository). Performing initial push."
              git push github HEAD:main
            else
              git fetch github main
              if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
                echo "ERROR: GitHub main has diverged from Bitbucket main." >&2
                echo "Remote GitHub commit $(git rev-parse FETCH_HEAD) is not an ancestor of local commit $(git rev-parse HEAD)." >&2
                echo "Manual reconciliation is required. Fast-forward push aborted to prevent data loss." >&2
                exit 1
              fi
              git push github HEAD:main
            fi

    - step: &deploy-database-migrations
        name: Apply Production Database Migrations
        deployment: Production
        caches:
          - npm
        script:
          - npm ci --legacy-peer-deps
          - npx prisma migrate deploy

    - step: &test-suite-ondemand
        name: Automated Test Suite (On-Demand)
        caches:
          - npm
        script:
          - npm ci --legacy-peer-deps
          - npm test

    - step: &docker-build-check
        name: Docker Build Verification (On-Demand)
        services:
          - docker
        script:
          - docker build --target development -t madhav-shringar-dev:ci .

pipelines:
  # Trigger ONLY when code is pushed to the main branch
  # Consolidated into 1 single step under 1 minute to save monthly build units
  branches:
    main:
      - step: *validate-and-sync

  # Manual on-demand triggers (conserve Bitbucket build units)
  custom:
    apply-production-migrations:
      - step: *deploy-database-migrations
    run-tests-manually:
      - step: *test-suite-ondemand
    docker-verify:
      - step: *docker-build-check